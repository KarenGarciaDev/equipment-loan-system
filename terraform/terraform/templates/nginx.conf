events {}

http {
  server {
    listen 8080;

    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok"}';
    }

    # Basic reverse proxy routes (edit as you prefer)
    location /api/v1/auth/ {
      proxy_pass http://api-auth:3000/;
    }
    location /api/v1/users/ {
      proxy_pass http://api-users:3001/;
    }
    location /api/v1/inventory/ {
      proxy_pass http://api-inventory:3002/;
    }
    location /api/v1/loans/ {
      proxy_pass http://api-loans:3003/;
    }
    location /api/v1/reservations/ {
      proxy_pass http://api-reservations:3004/;
    }
    location /api/v1/reports/ {
      proxy_pass http://api-reports:3007/;
    }
  }
}
