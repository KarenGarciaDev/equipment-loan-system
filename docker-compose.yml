version: "3.9"

services:
  # ---------------- DBs ----------------
  postgres-users:
    image: postgres:16
    container_name: postgres-users
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    networks:
      - qa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - qa-network

  mongo-notifications:
    image: mongo:7
    container_name: mongo-notifications
    ports:
      - "27017:27017"
    volumes:
      - mongo_notifications_data:/data/db
    networks:
      - qa-network

  # ---------------- Core services ----------------
  api-users:
    build: ./apps/api-users
    container_name: api-users
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres-users:5432/users_db?schema=public
    depends_on:
      postgres-users:
        condition: service_healthy
    networks:
      - qa-network

  api-auth:
    build: ./apps/api-auth
    container_name: api-auth
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=qa_secret
      - USERS_SERVICE_URL=http://api-users:3001
      - REDIS_URL=redis://redis-cache:6379
    depends_on:
      - api-users
      - redis-cache
    networks:
      - qa-network

  # ---------------- Other services (por ahora levantan “vacíos”) ----------------
  api-inventory:
    build: ./apps/api-inventory
    container_name: api-inventory
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - REDIS_URL=redis://redis-cache:6379
    depends_on:
      - redis-cache
    networks:
      - qa-network

  api-loans:
    build: ./apps/api-loans
    container_name: api-loans
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - REDIS_URL=redis://redis-cache:6379
    depends_on:
      - redis-cache
    networks:
      - qa-network

  api-reservations:
    build: ./apps/api-reservations
    container_name: api-reservations
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - REDIS_URL=redis://redis-cache:6379
    depends_on:
      - redis-cache
    networks:
      - qa-network

  api-notifications:
    build: ./apps/api-notifications
    container_name: api-notifications
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - MONGO_URL=mongodb://mongo-notifications:27017/notifications_db
    depends_on:
      - mongo-notifications
    networks:
      - qa-network

  api-audit:
    build: ./apps/api-audit
    container_name: api-audit
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - MONGO_URL=mongodb://mongo-notifications:27017/audit_db
    depends_on:
      - mongo-notifications
    networks:
      - qa-network

  api-reports:
    build: ./apps/api-reports
    container_name: api-reports
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
    networks:
      - qa-network

  api-automation:
    build: ./apps/api-automation
    container_name: api-automation
    ports:
      - "3008:3008"
    environment:
      - PORT=3008
    networks:
      - qa-network

  api-integration:
    build: ./apps/api-integration
    container_name: api-integration
    ports:
      - "3009:3009"
    environment:
      - PORT=3009
    networks:
      - qa-network

networks:
  qa-network:
    driver: bridge

volumes:
  postgres_users_data:
  mongo_notifications_data:
