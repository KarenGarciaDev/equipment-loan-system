version: "3.9"

services:
  api-auth:
    build: ./apps/api-auth
    container_name: api-auth
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=qa_secret
    networks:
      - qa-network

  api-users:
    build: ./apps/api-users
    container_name: api-users
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    networks:
      - qa-network

  api-inventory:
    build: ./apps/api-inventory
    container_name: api-inventory
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    networks:
      - qa-network

  api-loans:
    build: ./apps/api-loans
    container_name: api-loans
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
    networks:
      - qa-network

  api-reservations:
    build: ./apps/api-reservations
    container_name: api-reservations
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
    networks:
      - qa-network

  api-notifications:
    build: ./apps/api-notifications
    container_name: api-notifications
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
    networks:
      - qa-network

  api-audit:
    build: ./apps/api-audit
    container_name: api-audit
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
    networks:
      - qa-network

  api-reports:
    build: ./apps/api-reports
    container_name: api-reports
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
    networks:
      - qa-network

  api-automation:
    build: ./apps/api-automation
    container_name: api-automation
    ports:
      - "3008:3008"
    environment:
      - PORT=3008
    networks:
      - qa-network

  api-integration:
    build: ./apps/api-integration
    container_name: api-integration
    ports:
      - "3009:3009"
    environment:
      - PORT=3009
    networks:
      - qa-network

networks:
  qa-network:
    driver: bridge
