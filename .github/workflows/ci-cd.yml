name: CI/CD Pipeline 🚀

on:
  push:
    branches:
      - feature/init-monorepo
  pull_request:
    branches:
      - qa
      - main

jobs:
  # 1️⃣ Build and test microservices
  build-microservices:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-audit, api-auth, api-automation, api-integration, api-inventory, api-loans, api-notifications, api-reports, api-reservations, api-users]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd apps/${{ matrix.service }}
          npm install

      - name: Run tests
        run: |
          cd apps/${{ matrix.service }}
          npm run test

      - name: Build service
        run: |
          cd apps/${{ matrix.service }}
          npm run build

  # 2️⃣ Terraform plan and apply (QA)
  terraform-qa:
    runs-on: ubuntu-latest
    needs: build-microservices
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform -chdir=terraform/qa init

      - name: Terraform Plan
        run: terraform -chdir=terraform/qa plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/feature/init-monorepo'
        run: terraform -chdir=terraform/qa apply -auto-approve tfplan

  # 3️⃣ Docker build and push
  docker-build:
    runs-on: ubuntu-latest
    needs: build-microservices
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push images
        run: |
          for service in api-audit api-auth api-automation api-integration api-inventory api-loans api-notifications api-reports api-reservations api-users; do
            docker build -t ${{ secrets.DOCKER_USERNAME }}/$service:latest apps/$service
            docker push ${{ secrets.DOCKER_USERNAME }}/$service:latest
          done
